# Cierre diario (sin Claude): ordenes limitadas, dividendos/splits, snapshot de cierre,
# ejecuciones no realizadas y anclas de integridad. Gratis en repos publicos.
name: Cierre diario

# El cierre diario se hace en el PC principal (tarea ClaudeTrader-CLOSE, 22:30). Este workflow
# queda solo para lanzarlo a mano desde GitHub si hiciera falta (Actions > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: close-day
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Comprobar secretos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          ok=1
          [ -n "$SUPABASE_URL" ] && echo "SUPABASE_URL: definido" || { echo "::error::Falta el secreto SUPABASE_URL"; ok=0; }
          [ -n "$SUPABASE_SECRET_KEY" ] && echo "SUPABASE_SECRET_KEY: definido" || { echo "::error::Falta el secreto SUPABASE_SECRET_KEY"; ok=0; }
          case "$SUPABASE_URL" in https://*.supabase.co*) ;; *) echo "::error::SUPABASE_URL debe ser https://xxxx.supabase.co"; ok=0;; esac
          [ $ok = 1 ]
      - name: Cierre del dia
        run: npx tsx agent/close-day.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Publicar anclas de integridad
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrity/anchors.jsonl || true
          if ! git diff --cached --quiet; then
            git commit -m "Anclas de integridad $(date -u +%F)"
            git pull --rebase
            git push
          fi
